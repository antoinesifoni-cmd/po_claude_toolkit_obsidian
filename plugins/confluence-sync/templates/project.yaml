# Medfar project scaffold.
#
# Run with:
#   conf.py scaffold templates/project.yaml --set key=PT-534 \
#       --set "name=MYLE Physician Mobile App" --set "teams=Mobile,Charting" \
#       --parent 1154842646 --dry-run
#
# Titles render as "{key} - {title}", or "{key} - {team} - {title}" inside a team
# subtree (Confluence enforces unique page titles per space, so two teams sharing a
# leaf title would collide on creation). `raw: true` opts a node out of the prefix.
#
# Bodies are headings only, no tables - they are read in Obsidian far more often than
# in Confluence, and markdown tables render poorly there. Customise per page later.
#
# Meeting Notes sits at project level: the reviews are about the whole project. The
# pages below are the minimum; add other meetings (including future mandatory dev
# meetings) to that folder. Handoff is the exception: one per team, still in Meeting
# Notes, titled "{key} - {team} - Handoff". With a single team it is just "Handoff".
#
# Each team gets a "{team}" folder holding one folder per profession: PO Conception and
# Dev. With a single team that wrapper collapses into the project folder, so both sit
# directly under the project.

variables:
  key: ""                      # required, e.g. PT-534
  name: ""                     # required, e.g. "MYLE Physician Mobile App"
  teams: []                    # [] = single team. ["Mobile","Charting"] = per-team split

parent: ""
base: "Confluence Projects"

frontmatter:
  tags: ["{key}"]

tree:
  - type: folder
    title: "{name}"
    children:

      - type: page
        title: "Read Me"
        anchor: true
        body: |
          ## Context

          ## Problem to solve

          ## Scope

          ## Teams

          ## References

      - type: page
        title: "CLAUDE.md"
        raw: true
        target: obsidian
        body: |
          # {key} - {name}

          Project context for Claude Code when working in this folder.

          ## What this project is

          ## Where things live

          - Confluence: see `confluence_url` in each note's frontmatter
          - Jira: {key}

          ## Conventions

          - Every page and folder title is prefixed `{key} - `
          - Notes here are synced with Confluence via the confluence-sync plugin;
            run `conf.py status` before editing to check nothing moved upstream

      - type: folder
        title: "Meeting Notes"
        children:
          - type: page
            title: "Scope Review"
            body: |
              ## Attendees

              ## In scope

              ## Out of scope

              ## Decisions

              ## Action items
          - type: page
            title: "Product Preliminary Review"
            body: |
              ## Attendees

              ## Summary

              ## Risks and assumptions

              ## Decisions

              ## Action items
          - type: page
            title: "Product Internal Review"
            body: |
              ## Attendees

              ## Summary

              ## Feedback

              ## Decisions

              ## Action items
          - type: page
            title: "Product Detail Review"
            body: |
              ## Attendees

              ## Detailed behaviour

              ## Edge cases

              ## Decisions

              ## Action items

          # Handoff: one per team, but kept here with the other meetings. Written twice
          # because a per-team page has nothing to collapse into with a single team.
          - type: page
            title: "Handoff"
            when: single_team
            body: &handoff |
              ## Attendees

              ## Scope recap

              ## User Stories

              ## Open questions

              ## Action items
          - type: page
            title: "{team} - Handoff"
            when: multi_team
            repeat_per_team: true
            body: *handoff

      - type: folder
        title: "{team}"
        repeat_per_team: true
        children:

          - type: folder
            title: "PO Conception"
            children:
              - type: page
                title: "Analysis"
                body: |
                  ## Problem

                  ## Who is affected

                  ## Current workaround

                  ## Hypotheses

                  ## Open questions

          - type: folder
            title: "Dev"

      - type: page
        title: "Release plan"
        body: |
          ## Milestones

          ## Rollout

          ## Feature flag

          ## Rollback
